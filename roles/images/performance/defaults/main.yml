# Image Variables
guest_image: 'https://example.com/images/rhel-guest-image-9.8-20260408.3.x86_64.qcow2'
guest_image_output: '/tmp/'
guest_debug: False

# Repo Variables
repo_urls:
  - https://example.com/repos/rhel-9.8/repofile.repo
repo_dir: '/tmp/guest_repos'
guest_repos: []

# Trex Variables
trex_version: 'v3.06'
trex_url: 'https://trex-tgn.cisco.com/trex/release'
trex_dir: '/opt/trex/'

# EVPN Variables (prepare_evpn)
gobgp_version: '4.10.0'
gobgp_url: 'https://github.com/osrg/gobgp/releases/download'
evpn_gobgp_asn: 64999
evpn_gobgp_local_ip: '12.12.12.21'
evpn_gobgp_rr_ip: '12.12.12.2'

# Trafficgen Variables
trafficgen_git: 'https://github.com/perftool-incubator/bench-trafficgen'
trafficgen_dir: '/opt/bench-trafficgen'
trafficgen_branch: 'main'

# Customize users Variables
custom_users:
  - user: root
    password: changeme
  - user: cloud-user
    password: changeme
# selinux config
selinux_config: disabled

# fio Variables
fio_git: 'git://git.kernel.dk/fio.git'
fio_dir: '/root/fio'
fio_branch: 'fio-3.9'
fio_customization_log: "{{ fio_dir }}/customization.log"
