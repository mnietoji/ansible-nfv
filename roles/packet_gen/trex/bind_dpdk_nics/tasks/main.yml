# When dpdk_nics is given, bind exactly those and leave every other NIC up.
# Otherwise fall back to the heuristic: keep the default-route NIC (assumed to be
# mgmt) and bind the rest. That heuristic breaks when mgmt has no gateway (the
# default route then lives on a dataplane NIC, so mgmt gets torn down) or when a
# NIC must stay in the kernel (e.g. the EVPN inject VF), so prefer dpdk_nics.
- name: Retrieve default NIC
  set_fact:
    nic_def: "{{hostvars[inventory_hostname]['ansible_default_ipv4']['alias']}}"
  when: dpdk_nics is not defined

- name: Retrieve all NICs
  set_fact:
    nic_lst: "{{hostvars[inventory_hostname]['ansible_interfaces']}}"
  when: dpdk_nics is not defined

- name: List of NICs to be bound to DPDK
  set_fact:
    nic_down: "{{ nic_lst | difference([nic_def]+['lo'])  }}"
  when: dpdk_nics is not defined

- name: List of NICs to be bound to DPDK (explicit)
  set_fact:
    nic_down: "{{ dpdk_nics }}"
  when: dpdk_nics is defined

# Idempotency: a NIC already bound to DPDK (persistent driverctl override) has no
# kernel netdev after a reboot, so skip any requested NIC that is no longer a
# kernel interface -- it is already bound. testpmd/TRex auto-probe all vfio-pci
# devices, so nothing else needs its PCI slot here.
- name: Check which requested NICs still exist in the kernel
  stat:
    path: "/sys/class/net/{{ item }}"
  loop: "{{ nic_down }}"
  register: nic_down_present

- name: Keep only kernel-present NICs for DPDK binding
  set_fact:
    nic_down: "{{ nic_down_present.results | selectattr('stat.exists') | map(attribute='item') | list }}"

- name: Deactivate NICs to be bound to DPDK
  shell: "ip link set dev {{ item }} down"
  loop: "{{nic_down}}"
  become: True

- name: Retrieve pci slots for nics
  shell: |
    for nic in {{ nic_down | join(' ') }}; do
      ethtool -i $nic | awk '{if ($1 == "bus-info:") print $2}'
    done
  register: instance_nics_pci_slots
  become: True

- name: Bind Parsed NICs to DPDK
  block:
    - name: Create Hugepages Mountpoint
      file:
        path: /mnt/huge
        state: directory
        recurse: True

    - name: Set Huge Pages Amount
      sysctl:
        name: vm.nr_hugepages
        value: "{{ hugepages_count }}"
        state: present

    - name: Mount Hugepages
      mount:
        path: /mnt/huge
        src: nodev
        fstype: hugetlbfs
        opts: pagesize=1GB
        state: mounted

    - name: Load Required Kernel Modules
      community.general.modprobe:
        name: "{{ item['name'] }}"
        state: present
        params: "{{ item['params'] | default(omit) }}"
        persistent: "present"
      loop:
        - {'name': 'vfio', 'params': 'enable_unsafe_noiommu_mode=1'}
        - {'name': 'vfio-pci'}

    - name: Load Mellanox Kernel Modules when configured
      community.general.modprobe:
        name: mlx5_core
        state: present
        persistent: "present"
      when: dpdk_binding_driver == "mlx5_core"

    - name: Bind DPDK NICs
      command: "driverctl set-override {{ item }} {{dpdk_binding_driver}}"
      loop: "{{ instance_nics_pci_slots.stdout_lines }}"

  become: True

- name: Set DuT Destination MAC Addresses
  block:
    - name: Fetch Mac Addresses Of NICs Bound To Kernel
      shell: 'find /sys/devices -path "*virtio*" -name "address" -exec cat {} \;'
      register: kernel_nics

    - name: Query DuT Server Ports
      import_role:
        name: roles/post_install/discover_instance_ports
      vars:
        query_instance: "{{ ansible_hostname }}"
      delegate_to: "{{ groups['undercloud'] | first }}"

    - name: Map DuT NICs To Helper Variable
      set_fact:
        dut_ports: "{{ dut_ports | default([]) + item['ports'] }}"
      loop: "{{ instance_ports['results'] }}"

    - name: Parse DuT Destination Macs
      set_fact:
        dut_macs: "{{ dut_ports | map(attribute='mac_address') | reject('search', kernel_nics['stdout']) | list | join(',') }}"
  when:
    - dut_mac is not defined
    - discover_dut_macs | default(False)
